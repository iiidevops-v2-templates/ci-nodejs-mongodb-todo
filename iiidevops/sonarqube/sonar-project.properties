# SonarQube 掃描設定（sonar-project.properties 格式），需要時再取消註解
# - 路徑以 repo 根目錄為準
# - sonar.projectKey、sonar.projectVersion 由平台指定，不用寫
# - 設定 sonar.tests 時也要設定 sonar.sources，否則只會分析測試檔
# - unit test 請另寫 Test--Unit test job（例如 iiidevops/jobs/unit-test.yml），寫法見
#   iiidevops-templates/ci-template 的 job/Sonarqube.gitlab-ci.yml
# 參數說明：https://docs.sonarsource.com/sonarqube-server/analyzing-source-code/analysis-parameters/

#sonar.sources=app
#sonar.tests=app/tests
#sonar.exclusions=app/tests/**,app/coverage.xml
#sonar.python.coverage.reportPaths=app/coverage.xml
#sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
